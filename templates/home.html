{% extends "base.html" %}
{% block main %}
<div style="display: grid; grid-template-columns: auto auto auto;">
{% for row in images %}
<div><img style="max-width:100%" src="{{url_for('static', filename=row.filename)}}"/></div>
{% endfor %}
</div>
{% if images|length == 0 %}
<p>Pusto!</p>
{% endif %}
{% endblock %}
