<link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}">
<body>
<div style="padding: 24px; border-bottom: 1px solid gray; display: flex;">
<div style="display:flex; flex-grow:1;">
<form action="/search" method="get" style="flex-grow:1; display:flex;">
<input type="search" name="word" id="word" style="flex-grow: 1;" placeholder="Wyszukaj..."></input>
<input id="search_button" type="Submit" value="Szukaj"/>
</form>
</div>
{% if current_user.is_authenticated %}
<div class="top_div">
<p>{{ current_user.username }}</p>
</div>
<div class="top_div">
<form action="/upload"><input class="common_button color_button" id="top_upload_button" type="submit" value="Dodaj obraz"/></form>
</div>
<div class="top_div">
<form action="/logout"><input class="common_button" id="logout_button" type="submit" value="Wyloguj"/></form>
</div>
{% else %}
<div class="top_div">
<form action="/login_register"><input class="common_button" id="logout_button" type="submit" value="Zaloguj się"/></form>
</div>
<div class="top_div">
<form action="/login_register"><input class="common_button" id="logout_button" type="submit" value="Utwórz konto"/></form>
</div>
{% endif %}
</div>
{% block main %}
{% endblock %}
</body>
